<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tapper Config</title>

<style>
:root{
  --bg:#edf6fb;
  --card:#ffffff;
  --line:#d6e5ef;
  --text:#17324a;
  --muted:#6c8294;
  --blue:#2f80ed;
  --green:#19a66a;
  --red:#d94a4a;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page{
  width:100%;
  height:100%;
  min-height:100vh;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:min(620px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:0 12px 32px rgba(30,70,100,.10);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.title{
  font-size:25px;
  font-weight:900;
}

.subtitle{
  margin-top:4px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

.back{
  border:0;
  border-radius:12px;
  padding:10px 18px;
  font-weight:800;
  color:white;
  background:#315b7c;
  cursor:pointer;
}

.delayBox{
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#f8fbfd;
}

.delayHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.delayLabel{
  font-size:16px;
  font-weight:900;
}

.delayValue{
  min-width:82px;
  text-align:center;
  padding:8px 12px;
  border-radius:12px;
  background:white;
  border:1px solid var(--line);
  font-size:20px;
  font-weight:900;
  color:var(--blue);
}

input[type=range]{
  width:100%;
  margin:4px 0 12px;
}

.numberRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.numberInput{
  width:110px;
  height:42px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:17px;
  font-weight:900;
  color:var(--text);
}

.step{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:#54748d;
  cursor:pointer;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.btn{
  height:54px;
  border:0;
  border-radius:15px;
  font-size:14px;
  font-weight:900;
  color:white;
  cursor:pointer;
}

.sound{
  background:var(--blue);
}

.tapper{
  background:var(--green);
}

.save{
  grid-column:1/-1;
  background:#315b7c;
}

.status{
  margin-top:16px;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#f7fbfe;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
}

@media(max-width:520px){
  .page{
    padding:10px;
  }

  .card{
    padding:16px;
    border-radius:18px;
  }

  .title{
    font-size:21px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .save{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="card">

    <div class="top">
      <div>
        <div class="title">Tapper Config</div>
        <div class="subtitle">
          Sound test · Tapper test · Execution delay
        </div>
      </div>

      <button
        class="back"
        onclick="location.href='http://'+location.hostname+':8080/?v=back-from-calibration'"
      >
        Back
      </button>
    </div>


    <div class="delayBox">

      <div class="delayHeader">
        <div class="delayLabel">Tapper Execution Delay</div>

        <div class="delayValue">
          <span id="delayDisplay">5.0</span> s
        </div>
      </div>

      <input
        id="delayRange"
        type="range"
        min="0"
        max="10"
        step="0.5"
        value="5"
      >

      <div class="numberRow">
        <button class="step" id="minusBtn">−</button>

        <input
          id="delayInput"
          class="numberInput"
          type="number"
          min="0"
          max="10"
          step="0.5"
          value="5"
        >

        <button class="step" id="plusBtn">+</button>
      </div>

    </div>


    <div class="actions">

      <button class="btn sound" id="soundBtn">
        Test Sound
      </button>

      <button class="btn tapper" id="tapperBtn">
        Test Tapper
      </button>

      <button class="btn save" id="saveBtn">
        Save Delay
      </button>

    </div>


    <div class="status" id="status">
      Loading...
    </div>

  </div>
</div>


<script>
const $ = id => document.getElementById(id);

function clamp(v){
  v = Number(v);
  if(!Number.isFinite(v)) v = 5;
  return Math.max(0, Math.min(10, v));
}

function getDelaySeconds(){
  return clamp($("delayInput").value);
}

function sync(value){
  const v = clamp(value);

  $("delayInput").value = v.toFixed(1);
  $("delayRange").value = v;
  $("delayDisplay").textContent = v.toFixed(1);
}

async function post(path, body={}){
  const res = await fetch(path,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  });

  const data = await res.json();

  if(!res.ok || data.ok === false){
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function load(){
  try{
    const res = await fetch("/api/status");
    const data = await res.json();

    const delayMs =
      Number(data?.config?.delayMs ?? 5000);

    sync(delayMs / 1000);

    $("status").textContent =
      "Ready";
  }
  catch(e){
    $("status").textContent =
      "Could not load current delay";
  }
}

$("delayRange").addEventListener("input",()=>{
  sync($("delayRange").value);
});

$("delayInput").addEventListener("input",()=>{
  sync($("delayInput").value);
});

$("minusBtn").onclick = ()=>{
  sync(getDelaySeconds() - 0.5);
};

$("plusBtn").onclick = ()=>{
  sync(getDelaySeconds() + 0.5);
};


$("soundBtn").onclick = async ()=>{
  try{
    $("status").textContent =
      "Testing sound...";

    await post("/api/servo",{
      command:"buzz",
      buzzMs:300
    });

    $("status").textContent =
      "Sound test completed";
  }
  catch(e){
    $("status").textContent =
      "Sound test failed";
  }
};


$("tapperBtn").onclick = async ()=>{
  const delay = getDelaySeconds();

  try{
    $("status").textContent =
      `Tapper will run in ${delay.toFixed(1)} seconds...`;

    await new Promise(resolve =>
      setTimeout(resolve, delay * 1000)
    );

    await post("/api/servo",{
      command:"tap"
    });

    $("status").textContent =
      "Tapper test completed";
  }
  catch(e){
    $("status").textContent =
      "Tapper test failed";
  }
};


$("saveBtn").onclick = async ()=>{
  const delayMs =
    Math.round(getDelaySeconds() * 1000);

  try{
    $("status").textContent =
      "Saving delay...";

    const data = await post("/api/delay",{
      delayMs
    });

    sync(
      Number(data.delayMs ?? delayMs) / 1000
    );

    $("status").textContent =
      `Saved: ${(Number(data.delayMs ?? delayMs)/1000).toFixed(1)} s`;
  }
  catch(e){
    $("status").textContent =
      "Save failed: " + e.message;
  }
};


sync(5);
load();
</script>

</body>
</html>
